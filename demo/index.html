<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Comparison</title>

  <link rel="stylesheet" href="../dist/Reveal.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /*
      Keep the slider at the same 3:2 ratio
      as the 1920 × 1280 images.
    */
    .reveal {
      position: relative;
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 1920 / 1280;
      margin: 0 auto;
      overflow: hidden;
    }

    /*
      The images overlap each other.
      Reveal.css already makes the second image absolute.
    */
    .reveal-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .reveal-img:nth-child(2) {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    /*
      Keep the ORIGINAL divider styling from Reveal.css.
      These are only here to make sure the divider
      stays above the images.
    */
    .reveal-bar {
      z-index: 10;
    }

    .reveal-grabber {
      z-index: 11;
    }

    /*
      Prevent accidental text/image selection while dragging.
    */
    .reveal,
    .reveal * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>

<body>

  <div class="reveal">
    <img src="leftImage.jpg" alt="Before">
    <img src="rightImage.jpg" alt="After">
  </div>

  <script src="../dist/Reveal.js"></script>

</body>
</html>
