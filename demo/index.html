<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Comparison</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body::-webkit-scrollbar {
        display: none;
      }

      body {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .comparison {
        display: flex;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      .comparison img {
        display: block;
        width: 50%;
        height: 100%;
        object-fit: cover;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div class="comparison">
      <img src="leftImage.jpg" alt="Before">
      <img src="rightImage.jpg" alt="After">
    </div>
  </body>
</html>
