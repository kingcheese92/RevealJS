<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Comparison</title>

  <!-- Add a version number to prevent an old CSS file from being cached -->
  <link rel="stylesheet" href="../dist/Reveal.css?v=2">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /*
      1920 × 1280 = 3:2
      This makes the container match the image proportions.
    */
    .reveal {
      position: relative;
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 3 / 2;
      margin: 0 auto;
      overflow: hidden;
    }

    /*
      Let Reveal.css handle the positioning of the images.
    */
    .reveal-img {
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <div class="reveal">
    <img src="leftImage.jpg" alt="Before">
    <img src="rightImage.jpg" alt="After">
  </div>

  <script src="../dist/Reveal.js?v=2"></script>

</body>
</html>
