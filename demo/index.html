<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Comparison</title>

  <link rel="stylesheet" href="../dist/Reveal.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* The slider itself */
    .reveal {
      position: relative;
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 1920 / 1280;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Both images occupy the exact same space */
    .reveal .reveal-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      object-fit: cover;
      display: block;
    }

    /* Divider */
    .reveal .reveal-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 4px;
      margin-left: -2px;
      background: white;
      box-shadow:
        0 0 3px rgba(0, 0, 0, 0.7),
        0 0 8px rgba(0, 0, 0, 0.35);
      z-index: 10;
      cursor: ew-resize;
    }

    /* Circular handle */
    .reveal .reveal-grabber {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border-radius: 50%;
      background: white;
      border: 2px solid rgba(0, 0, 0, 0.5);
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.45);
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Arrows inside the handle */
    .reveal .reveal-arrows {
      color: #333;
      font-size: 17px;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: -3px;
      user-select: none;
    }

    /* Prevent selection while dragging */
    .reveal,
    .reveal * {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

  <div class="reveal">
    <img src="leftImage.jpg" alt="Before">
    <img src="rightImage.jpg" alt="After">
  </div>

  <script src="../dist/Reveal.js"></script>

</body>
</html>
